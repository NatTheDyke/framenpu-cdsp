name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FRAMENPU_REF: 4f2a2b4077872f80b74b77e1c7fc07e779214f90 # framenpu 0.4.2

jobs:
  host:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: NatTheDyke/framenpu
          ref: ${{ env.FRAMENPU_REF }}
          path: _framenpu
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install development tools
        run: python -m pip install ./_framenpu -e ".[dev]"
      - name: Offline tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Lint and formatting
        run: |
          ruff check --extend-exclude _framenpu .
          ruff format --check --exclude _framenpu .
      - name: Repository and payload checks
        run: python tools/check_repository.py
      - name: Build packages and test the wheel from the source archive
        run: |
          python -m pip wheel --no-deps -w framenpu-dist ./_framenpu
          python -m build
          python -m twine check dist/*
          python tools/check_distribution.py --dist dist --framenpu framenpu-dist/framenpu-*.whl

  models:
    # The whole suite with the real weights present (fetched by hash, framenpu's
    # tools/fetch_models.py), so the model-gated tests run the bundled image on the lane
    # simulator, both host paths. No device.
    runs-on: ubuntu-24.04
    env:
      FNPU_MERCURY_JOBS: ${{ github.workspace }}/src/framenpu_cdsp/data/mercury
      FNPU_MERCURY_HEADS_JOBS: ${{ github.workspace }}/src/framenpu_cdsp/data/mercury
      FNPU_MERCURY_DET_JOBS: ${{ github.workspace }}/src/framenpu_cdsp/data/mercury
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: NatTheDyke/framenpu
          ref: ${{ env.FRAMENPU_REF }}
          path: _framenpu
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.14"
      - name: Install
        run: python -m pip install ./_framenpu -e ".[cpu]"
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: models
          key: models-${{ hashFiles('_framenpu/src/framenpu/manifests/*.json', '_framenpu/tools/fetch_models.py') }}
      - name: Fetch the models
        run: python _framenpu/tools/fetch_models.py models --env | sed 's/^export //' >> "$GITHUB_ENV"
      - name: Tests with the models
        run: python -m unittest discover -s tests -p 'test_*.py' -v
